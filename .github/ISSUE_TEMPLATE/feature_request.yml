name: Feature request
description: Propose a capability, model family, check or benchmark task
labels: [enhancement]
body:
  - type: textarea
    id: question
    attributes:
      label: Problem
      description: What you were trying to do with the agent and where it fell short.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Proposed approach
      description: How it would work, and how the benchmark would show it helps.
    validations:
      required: true
